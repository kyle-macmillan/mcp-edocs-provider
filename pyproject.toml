[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-edocs-provider"
version = "0.1.0"
description = "Reusable AAuth-protected eDocs MCP provider"
requires-python = ">=3.10"
dependencies = [
    "aauth-edocs",
    "mcp",
    "mcp-aauth",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_edocs_provider"]

[tool.uv.sources]
aauth-edocs = { path = "../aauth", editable = true }
mcp-aauth = { path = "../mcp-aauth", editable = true }
mcp = { path = "../mcp-python-sdk", editable = true }
mcp-types = { path = "../mcp-python-sdk/src/mcp-types", editable = true }
